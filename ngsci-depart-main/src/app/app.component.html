@if (matchService.match == null) {
<mat-toolbar class="main-toolbar">
  <div class="brand" routerLink="/">
    <mat-icon>catching_pokemon</mat-icon>
    <span>Super Cartes Infinies</span>
  </div>

  <nav class="nav-links">
    <a routerLink="magasin" routerLinkActive="active">Magasin</a>
    <a routerLink="catalog" routerLinkActive="active">Catalogue</a>
    <a routerLink="OwnedCards" routerLinkActive="active">Mes cartes</a>
    <a routerLink="decks" routerLinkActive="active">Decks</a>
    <a routerLink="regardermatch" routerLinkActive="active">Parties</a>
    <a routerLink="stats" routerLinkActive="active">Stats</a>
  </nav>

  <span class="spacer"></span>

  @if (isLogged()) {
    <mat-chip class="chip-gold">⚡ {{ (ApiServices.gold$ | async) ?? 0 }} gold</mat-chip>
    <mat-chip class="chip-elo">🏆 {{ elo }}</mat-chip>
    <mat-chip>{{ getUsername() }}</mat-chip>
    <button mat-raised-button class="btn-pokemon btn-danger" (click)="logout()">Déconnexion</button>
  }
  @if (!isLogged()) {
    <button mat-raised-button class="btn-pokemon btn-primary" routerLink="/login">Connexion</button>
  }
</mat-toolbar>
}
<router-outlet></router-outlet>
