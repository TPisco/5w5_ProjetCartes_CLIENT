<div class="sort-toolbar">
  <mat-form-field>
    <mat-label>Type</mat-label>
    <mat-select [(ngModel)]="filters.type" (selectionChange)="onFiltersChanged()">
      <mat-option value="all">{{ typeLabels['all'] }}</mat-option>
      <mat-option *ngFor="let type of availableTypes" [value]="type">{{ typeLabel(type) }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Force</mat-label>
    <mat-select [(ngModel)]="filters.sortOrder" (selectionChange)="onFiltersChanged()">
      <mat-option value="asc">Croissante</mat-option>
      <mat-option value="desc">Décroissante</mat-option>
    </mat-select>
  </mat-form-field>
</div>

<p class="results-meta">
  {{ view.totalItems }} cartes · page {{ view.page }} / {{ view.totalPages }}
</p>

<div class="cards-container" *ngIf="view.items.length; else emptyState">
  <div *ngFor="let card of view.items" class="card-item">
    <app-card [card]="card"></app-card>
  </div>
</div>

<ng-template #emptyState>
  <p class="empty-state">Aucune carte à afficher.</p>
</ng-template>

<nav class="pagination" *ngIf="view.totalPages > 1">
  <button
    type="button"
    class="btn-pokemon btn-outline"
    (click)="goToPage(view.page - 1)"
    [disabled]="view.page <= 1"
  >
    ← Précédent
  </button>
  <span class="page-indicator">Page {{ view.page }} / {{ view.totalPages }}</span>
  <button
    type="button"
    class="btn-pokemon btn-outline"
    (click)="goToPage(view.page + 1)"
    [disabled]="view.page >= view.totalPages"
  >
    Suivant →
  </button>
</nav>
