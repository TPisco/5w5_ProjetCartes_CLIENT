<mat-form-field>
    <mat-label>Trier par type</mat-label>
    <mat-select [(ngModel)]="sortOrderProperty" (selectionChange)="onSortPropertyChange($event.value)">
        <mat-option value="attack" default>Attaque</mat-option>
        <mat-option value="health">Points de vie</mat-option>
        <mat-option value="cost">Coût en Mana</mat-option>
    </mat-select>
</mat-form-field>

<mat-form-field>
    <mat-label>Ordre</mat-label>
    <mat-select [(ngModel)]="sortOrder" (selectionChange)="onSortOrderChange($event.value)">
        <mat-option value="asc" default>Croissant</mat-option>
        <mat-option value="desc">Décroissant</mat-option>

    </mat-select>
</mat-form-field>

<!-- Boucle ngFor affichage carte -->
<div class="cards-container">


    <div *ngFor="let card of cards" class="card-item">
        <app-card [card]="card"></app-card>
      </div>

</div>
