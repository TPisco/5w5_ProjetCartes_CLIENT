@if (show == 'front') {
  <mat-card class="infinite-card" (click)="onCardClick()">
    <mat-card-header>
      <div mat-card-avatar class="infinite-card-mana-cost">
        {{ card?.cost }} <i class="fas fa-gem"></i>
      </div>
      <mat-card-title>{{ card?.name }}</mat-card-title>
    </mat-card-header>

    <mat-card-content class="infinite-card-content" style="background-image: url({{card?.imageUrl}});">
      <div style="display: flex; justify-content: space-between; padding: 0.5em;">
        <!-- Colonne gauche : Attaque / Défense -->
        <div style="display: flex; flex-direction: column; gap: 0.4em; font-size: 1.6em; text-shadow: 2px 2px 2px black;">
          <div style="display: flex; align-items: center; gap: 0.3em;">
            <i class="fas fa-fist-raised"></i>
            <span>{{ card?.attack }}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 0.3em;">
            <i class="fas fa-shield-alt"></i>
            <span>{{ card?.health }}</span>
          </div>
        </div>

        <!-- Colonne droite : Pouvoirs -->
        <div style="display: flex; flex-direction: column; gap: 0.4em; font-size: 1.6em; text-shadow: 2px 2px 2px black;">
          <div *ngFor="let cp of card?.cardPowers; let i = index"
               style="display: flex; align-items: center; gap: 0.3em;">
            <span [@bounce]="bounceState[i]">{{ cp.power.icon }}</span>
            <span>{{ cp.value }}</span>
          </div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
}

@if (show == 'back') {
  <mat-card class="infinite-card" style="background-image: url({{beautifulBackUrl}});">
  </mat-card>
}
