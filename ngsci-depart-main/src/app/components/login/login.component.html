<div class="login-container">
  <h2>Connexion</h2>

  <!-- Formulaire de connexion -->
  <form [formGroup]="loginForm">

    <!-- Champ Email -->
    <mat-form-field appearance="fill" class="form-field">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" placeholder="exemple@gmail.com" [(ngModel)]="Email" />

      <!-- Erreurs pour l'email -->
      <mat-error *ngIf="loginForm.controls['email'].hasError('required')">L'email est requis.</mat-error>
      <mat-error *ngIf="loginForm.controls['email'].hasError('email')">Le format de l'email est invalide.</mat-error>
      <mat-error *ngIf="loginForm.controls['email'].hasError('invalidCredentials')">L'email est incorrect.</mat-error>

    </mat-form-field>

    <!-- Champ Mot de Passe -->
    <mat-form-field appearance="fill" class="form-field">
      <mat-label>Mot de passe</mat-label>
      <input matInput type="password" formControlName="password" placeholder="Mot de passe" [(ngModel)]="Password" />

      <!-- Erreurs pour le mot de passe -->
      <mat-error *ngIf="loginForm.controls['password'].hasError('required')">Le mot de passe est requis.</mat-error>
      <mat-error *ngIf="loginForm.controls['password'].hasError('invalidCredentials')">le mot de passe est incorrect.</mat-error>
    </mat-form-field>

    <!-- Bouton de soumission -->
    <button mat-raised-button type="submit" [disabled]="loginForm.invalid" (click)="login()">Se connecter</button>

  </form>

  <!-- Bouton pour naviguer vers la page d'inscription -->
  <div class="register-link">
    <button mat-button (click)="CreateAccount()"> Pas de compte? S'inscrire </button>
  </div>
</div>

<!-- Styles CSS intégrés -->
<style>
  /* Conteneur du formulaire */
.login-container {
  background-color: #fff;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Titre */
h2 {
  font-size: 28px;
  margin-bottom: 24px;
  color: #3f51b5;
  font-weight: 600;
  text-transform: uppercase;
}

/* Style général des champs */
.mat-form-field {
  width: 100%;
  display: block;
  margin-bottom: 20px;
  min-height: 120px; /* Espace pour les erreurs et alignement */
}

/* Champ de saisie */
.mat-form-field .mat-input-element {
  padding: 12px;
  font-size: 16px;
  border-radius: 8px;
  border: 1px solid #ddd;
  transition: border-color 0.3s ease;
}

/* L'effet au survol des champs */
.mat-form-field .mat-input-element:focus {
  border-color: #3f51b5;
  box-shadow: 0 0 5px rgba(63, 81, 181, 0.3);
}

/* Gestion des messages d'erreur */
.mat-error {
  font-size: 13px;
  color: #e74c3c;
  display: block;
  line-height: 1.4;
  word-break: break-word;
}

/* Bouton */
button {
  width: 100%;
  padding: 14px;
  background-color: #3f51b5;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  transition: background-color 0.3s, transform 0.2s ease-in-out;
  margin-top: 20px;
}

/* Effet au survol du bouton */
button:hover {
  background-color: #303f9f;
  transform: translateY(-2px); /* Effet de levée */
}

/* Bouton désactivé */
button[disabled] {
  background-color: #9e9e9e;
  cursor: not-allowed;
}

/* Ajustement du formulaire */
.login-container form {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  width: 100%;
}

/* Liens de redirection */
/* Liens de redirection */
.register-link {
  margin-top: 20px;
  font-size: 14px;
  font-weight: 400;
}

/* Style du bouton "Pas de compte? S'inscrire" */
.register-link button {
  color: #3f51b5;
  font-weight: 600;
  text-transform: uppercase;
  background-color: transparent;
  border: none;
  padding: 12px;
  font-size: 16px;
  cursor: pointer;
  transition: color 0.3s, text-decoration 0.3s;
}

.register-link button:hover {
  text-decoration: underline;
  color: #303f9f;
}

/* Réduction des espaces et améliorations responsives */
@media (max-width: 600px) {
  .register-link {
    margin-top: 15px;
  }

  .register-link button {
    font-size: 14px;
  }
}


</style>
