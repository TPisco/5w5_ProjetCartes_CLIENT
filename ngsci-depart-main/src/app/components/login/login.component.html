<div class="login-container">
  <h2>Connexion</h2>

  <!-- Formulaire de connexion -->
  <form [formGroup]="loginForm">

    <!-- Champ Email -->
    <mat-form-field appearance="fill" class="form-field">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" placeholder="exemple@gmail.com" />

      <!-- Erreurs pour l'email -->
      <mat-error *ngIf="loginForm.controls['email'].hasError('required')">L'email est requis.</mat-error>
      <mat-error *ngIf="loginForm.controls['email'].hasError('email')">Le format de l'email est invalide.</mat-error>
    </mat-form-field>

    <!-- Champ Mot de Passe -->
    <mat-form-field appearance="fill" class="form-field">
      <mat-label>Mot de passe</mat-label>
      <input matInput type="password" formControlName="password" placeholder="Mot de passe" />

      <!-- Erreurs pour le mot de passe -->
      <mat-error *ngIf="loginForm.controls['password'].hasError('required')">Le mot de passe est requis.</mat-error>
    </mat-form-field>

    <!-- Bouton de soumission -->
    <button mat-raised-button type="submit" [disabled]="loginForm.invalid">Se connecter</button>

  </form>

  <!-- Bouton pour naviguer vers la page d'inscription -->
  <div class="register-link">
    <button mat-button (click)="CreateAccount()"> Pas de compte? S'inscrire </button>
  </div>
</div>

<!-- Styles CSS intégrés -->
<style>
  /* Conteneur du formulaire */
  .login-container {
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Style général des champs */
  .mat-form-field {
    width: 100%;
    display: block;
    margin-bottom: 16px;
  }

  /* Bouton */
  button {
    width: 100%;
    padding: 12px;
    background-color: #2196F3;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.3s;
    margin-top: 20px;
  }

  button:hover {
    background-color: #1976D2;
  }

  /* Titre */
  h2 {
    font-size: 24px;
    margin-bottom: 16px;
    color: #333;
  }

  /* Style du lien vers l'inscription */
  .register-link {
    margin-top: 20px;
  }
</style>
