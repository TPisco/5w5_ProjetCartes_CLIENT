<div class="hand-row" [class.hand-row--blocked]="!readOnly && !matchService.isCurrentPlayerTurn" [class.hand-row--readonly]="readOnly || matchService.isSpectator">
  <div class="container">
    @for (card of cards; track card) {
      <app-card
        [card]="card.card"
        [id]="card.id"
        class="card fadeIn"
        [class.card--disabled]="!readOnly && !matchService.isCurrentPlayerTurn"
        (click)="click(card.id)"></app-card>
    }
  </div>
  @if (!readOnly && !matchService.isSpectator && !matchService.isCurrentPlayerTurn) {
    <p class="hand-hint">En attente de votre tour pour jouer une carte</p>
  }
</div>
